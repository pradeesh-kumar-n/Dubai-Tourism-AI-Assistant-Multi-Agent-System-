name: Live Demo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Install ngrok
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null && \
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list && \
        sudo apt update && sudo apt install -y ngrok
    - name: Start application and expose via ngrok
      id: ngrok
      run: |
        # Start the FastAPI app in background
        nohup uvicorn main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
        echo $! > app.pid

        # Wait for app to start
        sleep 10

        # Start ngrok tunnel
        ngrok http 8000 --log=stdout > ngrok.log 2>&1 &
        echo $! > ngrok.pid

        # Wait for ngrok to initialize
        sleep 15

        # Get the public URL
        NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url // empty')

        if [ -z "$NGROK_URL" ]; then
          echo "Failed to get ngrok URL"
          cat ngrok.log
          exit 1
        fi

        echo "Demo URL: $NGROK_URL"
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_OUTPUT
        echo "NGROK_URL=$NGROK_URL" >> $GITHUB_ENV

        # Keep the job running to maintain the tunnel
        while true; do
          sleep 300
        done
      shell: bash
    - name: Display demo information
      if: always()
      run: |
        echo "Live demo is running!"
        echo "Access your application at: ${{ env.NGROK_URL }}"
        echo "Note: This demo will remain active as long as the GitHub Actions job is running."
        echo "To stop the demo, cancel this workflow run."
      shell: bash