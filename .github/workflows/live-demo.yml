name: Live Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  demo:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install ngrok and jq
      run: |
        curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc
        echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt update
        sudo apt install -y ngrok jq

    - name: Verify Python imports
      run: |
        echo "Verifying Python imports..."
        python -c "import main; print('✅ main module imported successfully')"
        python -c "import tourism_graph; print('✅ tourism_graph module imported successfully')"
        python -c "from tourism_graph import build_tourism_graph; print('✅ build_tourism_graph imported successfully')"
        python -c "import fastapi; import uvicorn; print('✅ FastAPI and Uvicorn imported successfully')"

    - name: Start demo
      id: demo
      run: |
        # Start the app
        echo "Starting application..."
        nohup uvicorn main:app --host 0.0.0.0 --port 8000 > app.log 2>&1 &
        echo $! > app.pid

        # Wait for app to start
        echo "Waiting for app to start..."
        for i in {1..30}; do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health | grep -q "200"; then
            echo "✅ Application started successfully"
            break
          fi
          echo "⏳ Waiting for app... ($i/30)"
          sleep 2
        done

        # Start ngrok
        echo "Starting ngrok tunnel..."
        ngrok http 8000 --log=stdout > ngrok.log 2>&1 &
        echo $! > ngrok.pid

        # Wait for ngrok
        echo "Waiting for ngrok to start..."
        for i in {1..30}; do
          if curl -s -o /dev/null -w "%{http_code}" http://localhost:4040/api/tunnels | grep -q "200"; then
            echo "✅ Ngrok tunnel established"
            break
          fi
          echo "⏳ Waiting for ngrok... ($i/30)"
          sleep 2
        done

        # Get public URL
        echo "Getting public URL..."
        NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url' | head -1)

        if [ -z "$NGROK_URL" ] || [ "$NGROK_URL" = "null" ]; then
          echo "❌ Failed to get ngrok URL"
          echo "Ngrok log:"
          cat ngrok.log
          exit 1
        fi

        echo "🎉 Demo URL: $NGROK_URL"
        echo "demo_url=$NGROK_URL" >> $GITHUB_OUTPUT

        # Keep alive
        echo "Demo is running. To stop, cancel this workflow."
        while true; do
          sleep 300
        done

    - name: Show demo info
      if: always()
      run: |
        echo "Live demo finished or was stopped."
        if [ -n "${{ steps.demo.outputs.demo_url }}" ]; then
          echo "Demo was accessible at: ${{ steps.demo.outputs.demo_url }}"
        else
          echo "Demo URL not available"
        fi