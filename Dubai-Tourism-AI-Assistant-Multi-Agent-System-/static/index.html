<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dubai Tourism AI Assistant</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --primary: #0f172a;
      --accent: #2563eb;
      --muted: #475569;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
      font-family: Arial, sans-serif;
      color: var(--primary);
    }

    .card {
      width: min(680px, 92vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.08);
      padding: 32px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 2rem;
    }

    p {
      color: var(--muted);
      margin: 0 0 22px;
      line-height: 1.6;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
    }

    button {
      width: 100%;
      padding: 14px 18px;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    #response {
      margin-top: 24px;
      min-height: 120px;
      padding: 18px;
      border-radius: 12px;
      background: #f8fafc;
      border: 1px solid var(--border);
      white-space: pre-line;
      line-height: 1.6;
      color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Dubai Tourism AI Assistant</h1>
    <p>Ask about attractions, restaurants, or general tourist information in Dubai.</p>

    <input id="query" type="text" placeholder="What are the best landmarks in Dubai?" />
    <button onclick="ask()">Ask Assistant</button>

    <div id="response">Your answer will appear here.</div>
  </div>

  <script>
    const BACKEND_URL = window.location.origin;

    async function ask() {
      const query = document.getElementById('query').value.trim();
      if (!query) return;

      const responseBox = document.getElementById('response');
      responseBox.textContent = 'Thinking...';

      try {
        const res = await fetch(`${BACKEND_URL}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query })
        });

        if (!res.ok) {
          throw new Error(`Request failed with status ${res.status}`);
        }

        const data = await res.json();
        responseBox.textContent = `Intent: ${data.intent}\n\n${data.response}`;
      } catch (error) {
        responseBox.textContent = `Error: ${error.message}`;
      }
    }
  </script>
</body>
</html>
