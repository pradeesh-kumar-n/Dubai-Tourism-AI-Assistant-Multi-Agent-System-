<!DOCTYPE html>
<html>
<head>
    <title>Dubai Tourism AI</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            max-width: 700px; 
            margin: 60px auto; 
            padding: 20px; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .card {
            background: rgb(155, 30, 103);
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(211, 111, 111, 0.3);
        }
        h1 { color: #ffffff; margin-bottom: 8px; }
        .subtitle { color: #e1e1e1; margin-bottom: 30px; }
        input { 
            width: 100%; 
            padding: 14px; 
            font-size: 16px; 
            margin-bottom: 12px; 
            border: 2px solid #e0e0e0;
            border-radius: 8px;
        }
        input:focus { outline: none; border-color: #667eea; }
        button { 
            width: 100%;
            padding: 14px 32px; 
            background: #667eea; 
            color: white; 
            border: none; 
            border-radius: 8px;
            cursor: pointer; 
            font-size: 16px;
            font-weight: 600;
        }
        button:hover { background: #5a67d8; }
        #response { 
            margin-top: 24px; 
            padding: 20px; 
            background: #f8f9fa; 
            border-radius: 12px; 
            min-height: 60px;
            line-height: 1.6;
            color: #333;
            white-space: pre-line;
        }
        .thinking { color: #667eea; font-style: italic; }
        .badge {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .backend-info {
            font-size: 12px;
            color: #e1e1e1;
            margin-top: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">🤖 AI-Powered</div>
        <h1>🌴 Dubai Tourism AI Assistant</h1>
        <p class="subtitle">Ask me about attractions, restaurants, or travel tips!</p>
        
        <input type="text" id="query" placeholder="What are the best beaches in Dubai?" 
               onkeypress="if(event.key==='Enter')ask()">
        <button onclick="ask()">Ask</button>
        
        <div id="response"></div>
        <div class="backend-info">
            Backend: <strong id="backendUrl">Railway</strong>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://web-production-a91915.up.railway.app';

        async function ask() {
            const query = document.getElementById('query').value.trim();
            if (!query) return;
            
            const responseDiv = document.getElementById('response');
            responseDiv.innerHTML = '<span class="thinking">🧠 Thinking...</span>';
            
            try {
                const res = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query }),
                    mode: 'cors'
                });
                
                if (!res.ok) throw new Error('Server error: ' + res.status + ' ' + res.statusText);
                const data = await res.json();
                
                responseDiv.innerHTML = '<strong>Intent:</strong> <span style="color:#667eea">' + data.intent + '</span><br><br><strong>Response:</strong><br>' + data.response;
            } catch (err) {
                console.error('Error:', err);
                responseDiv.innerHTML = '<span style="color:red;">❌ Error: ' + err.message + '</span><br><small>Make sure the Railway backend is running and CORS is enabled.</small>';
            }
        }
    </script>
</body>
</html>
