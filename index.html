<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dubai Tourism AI Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #071a2d, #075985);
      color: #ffffff;
    }

    .card {
      width: min(680px, 100%);
      padding: 36px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.10);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.30);
      text-align: center;
    }

    .badge {
      display: inline-block;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 183, 3, 0.20);
      color: #ffe29a;
      font-size: 14px;
    }

    h1 {
      margin: 20px 0 12px;
      font-size: clamp(30px, 5vw, 48px);
      color: #ffd166;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #e1f3ff;
      line-height: 1.6;
    }

    input,
    button {
      width: 100%;
      padding: 15px;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      border: 0;
      outline: none;
      color: #1f2937;
    }

    button {
      margin-top: 12px;
      border: 0;
      background: #ffb703;
      color: #14213d;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #ffd166;
    }

    #response {
      min-height: 48px;
      margin-top: 22px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.16);
      color: #fff3c4;
      line-height: 1.6;
      text-align: left;
    }

    .status {
      font-size: 12px;
      color: #ffd166;
      margin-top: 10px;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">🤖 AI-Powered Tourism Guide</div>

    <h1>🌴 Dubai Tourism AI Assistant</h1>

    <p class="subtitle">
      Ask about Dubai attractions, restaurants, beaches, travel tips, and places to visit.
    </p>

    <input
      type="text"
      id="query"
      placeholder="Example: What are the best beaches in Dubai?"
      onkeypress="if (event.key === 'Enter') ask()"
    >

    <button onclick="ask()">Ask Assistant</button>

    <div id="response">
      Enter a question to test the Dubai Tourism AI Assistant.
    </div>
    <div class="status" id="status"></div>
  </main>

<script>
// Get backend URL from environment or use Render deployment
const getBackendUrl = () => {
  // Check if deployed on GitHub Pages with environment variable
  const renderBackend = document.currentScript?.getAttribute('data-backend');
  if (renderBackend) return renderBackend;
  
  // Check if running locally
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
    return 'http://localhost:8000';
  }
  
  // For GitHub Pages deployment, use Render backend
  // Replace YOUR-RENDER-URL with your actual Render deployment URL
  return 'https://dubai-tourism-api.onrender.com';
};

const API_URL = window.location.origin;
fetch("/chat", {
  method: "POST",
  headers: { "Content-Type": "application/json" },
  body: JSON.stringify({ query: question })
});
const updateStatus = (message) => {
  document.getElementById('status').textContent = message;
};

async function ask() {
  const question = document.getElementById("query").value.trim();
  const responseEl = document.getElementById("response");

  if (!question) {
    responseEl.textContent = "Please enter a Dubai travel question.";
    return;
  }

  responseEl.textContent = "🧠 Thinking...";
  updateStatus("🔄 Calling backend...");

  try {
    console.log('Calling API at:', API_URL + "/chat");
    
    const res = await fetch(API_URL + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query: question }),
      mode: 'cors'
    });

    if (!res.ok) {
      throw new Error(`Backend returned status ${res.status} (${res.statusText})`);
    }

    const data = await res.json();
    updateStatus("✅ Connected to backend");
    
    responseEl.innerHTML = 
      `<strong>Intent:</strong> <span style="color:#ffd166">${data.intent}</span><br><br>` +
      `<strong>Response:</strong><br>${data.response}`;
  } catch (err) {
    updateStatus("❌ Backend connection failed");
    responseEl.innerHTML = `<strong>Error:</strong> ${err.message}<br><br>
      <small>Make sure the backend is running. Currently trying: ${API_URL}</small>`;
    console.error('Full error:', err);
  }
}
</script>
</body>
</html>
